<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem; }
    header { margin-bottom: 2.5rem; }
    header a {
      color: var(--accent);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
    }
    h1 { font-size: 2rem; margin-bottom: 1.5rem; line-height: 1.3; }
    .content h2 { margin: 1.5rem 0 0.75rem; font-size: 1.4rem; }
    .content h3 { margin: 1.25rem 0 0.5rem; font-size: 1.15rem; }
    .content p { margin-bottom: 1rem; }
    .content a { color: var(--accent); }
    .content ul, .content ol { margin: 0 0 1rem 1.5rem; }
    .content code {
      background: var(--surface);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .content pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    .content pre code { background: none; padding: 0; }
    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .posts { margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--border); }
    .posts h2 { font-size: 1.1rem; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .posts ul { list-style: none; }
    .posts li { margin-bottom: 0.5rem; }
    .posts a { color: var(--text); text-decoration: none; }
    .posts a:hover { color: var(--accent); }
    .back { display: inline-block; margin-bottom: 1.5rem; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header><a href="/">← Home</a></header>

    {% if not is_home %}
    <a class="back" href="/">← Back to home</a>
    {% endif %}

    <h1>{{ page.title }}</h1>
    <div class="content">{{ page.html | safe }}</div>

    {% if is_home and posts %}
    <nav class="posts">
      <h2>Posts</h2>
      <ul>
        {% for post in posts %}
        <li><a href="/posts/{{ post.slug }}">{{ post.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    {% endif %}
  </div>
</body>
</html>
